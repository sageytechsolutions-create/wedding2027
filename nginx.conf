# Nginx Configuration for AI Real Estate Investment Platform
# Production-grade configuration with blue-green deployment support

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50M;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml font/truetype font/opentype
             application/vnd.ms-fontobject image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  # Upstream configuration for blue-green deployment
  # Blue environment (current production)
  upstream backend_blue {
    server backend-blue:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream frontend_blue {
    server frontend-blue:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Green environment (new deployment)
  upstream backend_green {
    server backend-green:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream frontend_green {
    server frontend-green:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Current active environment (set to 'blue' or 'green')
  map $deployment_env {
    default "backend_blue";
    blue "backend_blue";
    green "backend_green";
  }

  map $deployment_env {
    default "frontend_blue";
    blue "frontend_blue";
    green "frontend_green";
  }

  # =========================================================================
  # HTTP to HTTPS Redirect
  # =========================================================================
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # =========================================================================
  # Main HTTPS Server
  # =========================================================================
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-realestate.com www.ai-realestate.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =====================================================================
    # Health Check Endpoint
    # =====================================================================
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # =====================================================================
    # API Routes (Backend)
    # =====================================================================
    location ~ ^/api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://$backend_env;
      proxy_http_version 1.1;

      # Headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";

      # Timeouts
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 24 4k;
      proxy_busy_buffers_size 16k;

      # Error handling
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 10s;
    }

    # =====================================================================
    # Authentication API (Special rate limiting)
    # =====================================================================
    location ~ ^/api/auth/(login|register) {
      limit_req zone=login burst=10 nodelay;

      proxy_pass http://$backend_env;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # =====================================================================
    # Frontend Routes (SPA)
    # =====================================================================
    location / {
      limit_req zone=general burst=20 nodelay;

      proxy_pass http://$frontend_env;
      proxy_http_version 1.1;

      # Headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      # Timeouts
      proxy_connect_timeout 5s;
      proxy_send_timeout 20s;
      proxy_read_timeout 20s;

      # Caching for static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$frontend_env;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        expires 30d;
        add_header Cache-Control "public, immutable";
      }

      # Service Worker
      location = /service-worker.js {
        proxy_pass http://$frontend_env;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }

      # HTML files (no caching)
      location ~* \.html?$ {
        proxy_pass http://$frontend_env;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }
    }

    # =====================================================================
    # Monitoring & Metrics (Internal only)
    # =====================================================================
    location ~ ^/(prometheus|grafana|metrics) {
      auth_basic "Monitoring Access";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_pass http://prometheus:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =====================================================================
    # Error Pages
    # =====================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }

  # =========================================================================
  # Staging Server Configuration
  # =========================================================================
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.ai-realestate.com;

    ssl_certificate /etc/nginx/ssl/staging_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/staging_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
      proxy_pass http://frontend-blue:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/ {
      proxy_pass http://backend-blue:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
