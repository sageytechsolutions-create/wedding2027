version: '3.8'

# AI Real Estate Investment Platform - Production Deployment
# Blue-Green deployment configuration for zero-downtime updates

services:
  # =========================================================================
  # Core Application Services
  # =========================================================================

  # Backend API Server (Blue Environment - Current)
  backend-blue:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-wedding2027}/backend:${BACKEND_TAG:-latest}
    container_name: backend-blue
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "3001:3000"
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.example.deployment=blue"
      - "com.example.role=backend"

  # Backend API Server (Green Environment - New Version)
  backend-green:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-wedding2027}/backend:${BACKEND_TAG:-latest}
    container_name: backend-green
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "3002:3000"
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - green
    labels:
      - "com.example.deployment=green"
      - "com.example.role=backend"

  # Frontend Web Server (Blue Environment - Current)
  frontend-blue:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-wedding2027}/frontend:${FRONTEND_TAG:-latest}
    container_name: frontend-blue
    restart: always
    ports:
      - "3003:3000"
    networks:
      - app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api.example.com}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    depends_on:
      - backend-blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.example.deployment=blue"
      - "com.example.role=frontend"

  # Frontend Web Server (Green Environment - New Version)
  frontend-green:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-wedding2027}/frontend:${FRONTEND_TAG:-latest}
    container_name: frontend-green
    restart: always
    ports:
      - "3004:3000"
    networks:
      - app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api.example.com}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    depends_on:
      - backend-green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - green
    labels:
      - "com.example.deployment=green"
      - "com.example.role=frontend"

  # =========================================================================
  # Database & Cache Services
  # =========================================================================

  # PostgreSQL Database (Shared by both environments)
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wedding2027_prod}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (Shared by both environments)
  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Load Balancer & Reverse Proxy
  # =========================================================================

  # Nginx Load Balancer (Routes to Blue by default, can switch to Green)
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - app
    depends_on:
      - backend-blue
      - frontend-blue
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
