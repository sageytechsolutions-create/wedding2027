global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Template files for formatting alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route with all parameters, which are inherited by the child routes if they are not overwritten.
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Routes for specific alert types
  routes:
    # Critical alerts go to PagerDuty immediately
    - match:
        severity: critical
      receiver: 'pagerduty'
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    # Warning alerts go to Slack
    - match:
        severity: warning
      receiver: 'slack'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts go to email
    - match:
        severity: info
      receiver: 'email'
      group_wait: 1m
      repeat_interval: 1d

    # Application alerts
    - match_re:
        component: 'application|business'
      receiver: 'app-team'
      group_wait: 10s
      continue: true

    # Database alerts
    - match:
        component: 'database'
      receiver: 'database-team'
      group_wait: 10s
      continue: true

    # System alerts
    - match:
        component: 'system'
      receiver: 'ops-team'
      group_wait: 10s
      continue: true

    # Availability alerts
    - match:
        component: 'availability'
      receiver: 'on-call'
      group_wait: 0s
      repeat_interval: 15m

# Inhibition rules to suppress certain alerts
inhibit_rules:
  # Suppress warning/info alerts if critical alert exists for same component
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['alertname', 'component', 'instance']

  # Suppress non-critical alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*Rate|Slow.*|.*Usage'
    equal: ['instance']

  # Suppress connection pool alerts when database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match:
      component: 'database'
    equal: ['instance']

# Receivers define how to send alerts
receivers:
  # Default receiver (email)
  - name: 'default'
    email_configs:
      - to: 'alerts@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: '${SMTP_USERNAME}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '[{{ .GroupLabels.alertname }}] {{ .Alerts.Firing | len }} firing'
        html: |
          {{ range .Alerts.Firing }}
          <h4>{{ .Labels.alertname }}</h4>
          <p>{{ .Annotations.description }}</p>
          {{ end }}

  # PagerDuty for critical alerts
  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .Alerts.Firing | len }} firing'
        client: 'Prometheus'
        client_url: 'http://prometheus:9090'
        details:
          severity: '{{ .Alerts.Firing | index 0 | .Labels.severity }}'
          component: '{{ .Alerts.Firing | index 0 | .Labels.component }}'

  # Slack for team notifications
  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts.Firing }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ (index .Alerts 0).Annotations.dashboard }}'
          - type: button
            text: 'View Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook }}'

  # App team Slack channel
  - name: 'app-team'
    slack_configs:
      - channel: '#app-alerts'
        title: '🚀 Application Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts.Firing }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Database team Slack channel
  - name: 'database-team'
    slack_configs:
      - channel: '#database-alerts'
        title: '🗄️ Database Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts.Firing }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Ops team Slack channel
  - name: 'ops-team'
    slack_configs:
      - channel: '#ops-alerts'
        title: '⚙️ System Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts.Firing }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # On-call team for critical availability issues
  - name: 'on-call'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_ONCALL_KEY}'
        description: '{{ .GroupLabels.alertname }} - {{ .Alerts.Firing | len }} firing'
        client: 'Prometheus'
        client_url: 'http://prometheus:9090'
        details:
          severity: 'critical'
          component: '{{ .Alerts.Firing | index 0 | .Labels.component }}'
    slack_configs:
      - channel: '#oncall'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts.Firing }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook }}{{ end }}'
        send_resolved: true
        color: 'danger'
