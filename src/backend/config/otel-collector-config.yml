receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  zipkin:
    endpoint: 0.0.0.0:9411

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  attributes:
    actions:
      - key: environment
        value: production
        action: insert
      - key: service.namespace
        value: ai-realestate
        action: insert

  resource_detection:
    detectors: [gce, ec2, ecs, k8s, docker, system, env]
    timeout: 2s
    override: false

  span:
    to_attributes:
      rules:
        - ^http\.method$
        - ^http\.status_code$
        - ^http\.url$
        - ^db\.system$
        - ^db\.operation$
        - ^rpc\.method$
        - ^rpc\.service$

  transform:
    log_statements:
      - context: log
        statements:
          - set(severity_text, "DEBUG") where severity_number < 5
          - set(severity_text, "INFO") where severity_number >= 5 and severity_number < 9
          - set(severity_text, "WARN") where severity_number >= 9 and severity_number < 13
          - set(severity_text, "ERROR") where severity_number >= 13 and severity_number < 17
          - set(severity_text, "FATAL") where severity_number >= 17

exporters:
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  logging:
    loglevel: debug

  otlp:
    client:
      endpoint: localhost:4317
      tls:
        insecure: true

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp, zipkin, jaeger]
      processors: [memory_limiter, resource_detection, attributes, span, batch]
      exporters: [jaeger, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, logging]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [logging]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: :8888
