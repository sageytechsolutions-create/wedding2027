name: Deploy Monitoring Infrastructure

on:
  push:
    paths:
      - 'src/backend/config/**'
      - 'docker-compose.monitoring.yml'
      - '.github/workflows/deploy-monitoring.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/monitoring

jobs:
  validate:
    name: Validate Monitoring Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Prometheus configuration
        run: |
          docker run --rm -v ${{ github.workspace }}/src/backend/config:/config \
            prom/prometheus:latest \
            promtool check config /config/prometheus.yml

      - name: Validate Alert rules
        run: |
          docker run --rm -v ${{ github.workspace }}/src/backend/config:/config \
            prom/prometheus:latest \
            promtool check rules /config/alert_rules.yml

      - name: Validate Recording rules
        run: |
          docker run --rm -v ${{ github.workspace }}/src/backend/config:/config \
            prom/prometheus:latest \
            promtool check rules /config/recording_rules.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm -v ${{ github.workspace }}/src/backend/config:/config \
            prom/alertmanager:latest \
            amtool check-config /config/alertmanager.yml

      - name: Validate Docker Compose configuration
        run: |
          docker-compose -f docker-compose.monitoring.yml config > /dev/null

      - name: Validate Grafana dashboards (JSON)
        run: |
          for dashboard in src/backend/config/grafana_*.json; do
            echo "Validating $dashboard"
            jq empty "$dashboard" || exit 1
          done

  build:
    name: Build Monitoring Images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile.prometheus
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prometheus-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prometheus-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prometheus-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prometheus-buildcache,mode=max

      - name: Build and push Alertmanager image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile.alertmanager
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alertmanager-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alertmanager-${{ github.sha }}

      - name: Build and push Grafana image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile.grafana
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:grafana-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:grafana-${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://grafana.staging.ai-realestate.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /opt/monitoring
            git pull origin main
            docker-compose -f docker-compose.monitoring.yml pull
            docker-compose -f docker-compose.monitoring.yml up -d
            echo "Staging deployment complete"
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://grafana.staging.ai-realestate.com/api/health || exit 1
          curl -f https://prometheus.staging.ai-realestate.com/-/healthy || exit 1

      - name: Run smoke tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace \
            curlimages/curl:latest \
            /bin/sh -c '
              curl -f http://prometheus:9090/-/healthy || exit 1
              curl -f http://grafana:3000/api/health || exit 1
              curl -f http://alertmanager:9093/-/healthy || exit 1
            '

      - name: Notify deployment
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Monitoring infrastructure deployed to staging",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Monitoring Infrastructure Deployed to Staging*\n*Grafana:* https://grafana.staging.ai-realestate.com\n*Prometheus:* https://prometheus.staging.ai-realestate.com"
                  }
                }
              ]
            }

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://grafana.ai-realestate.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          auto_merge: false

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /opt/monitoring
            git pull origin main
            docker-compose -f docker-compose.monitoring.yml pull
            docker-compose -f docker-compose.monitoring.yml up -d
            docker-compose -f docker-compose.monitoring.yml logs --tail=50
            echo "Production deployment complete"
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://grafana.ai-realestate.com/api/health || exit 1
          curl -f https://prometheus.ai-realestate.com/-/healthy || exit 1

      - name: Update deployment status
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          environment_url: https://grafana.ai-realestate.com

      - name: Notify deployment
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚀 Monitoring infrastructure deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Monitoring Infrastructure Deployed to Production*\n*Grafana:* https://grafana.ai-realestate.com\n*Prometheus:* https://prometheus.ai-realestate.com"
                  }
                }
              ]
            }

      - name: Notify failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Monitoring infrastructure deployment to production failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Monitoring Infrastructure Deployment Failed*\n*Commit:* ${{ github.sha }}\n*View:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
