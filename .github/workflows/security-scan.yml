name: Security Scanning & Vulnerability Management

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-audit:
    name: Dependency Audit & Vulnerability Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/backend

      - name: npm audit (frontend)
        run: npm audit --audit-level=moderate --legacy-peer-deps
        working-directory: ./src/frontend
        continue-on-error: true

      - name: npm audit (backend)
        run: npm audit --audit-level=moderate
        working-directory: ./src/backend
        continue-on-error: true

      - name: Generate audit report
        run: |
          npm audit --json > audit-report.json 2>&1 || true
        working-directory: ./src/backend

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report-${{ matrix.node-version }}
          path: src/backend/audit-report.json
          retention-days: 30

  snyk-scan:
    name: Snyk Vulnerability Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --file=src/backend/package.json

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
          category: snyk

  codeql-scan:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Build (backend)
        run: |
          npm ci
          npm run build
        working-directory: ./src/backend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: /language:${{ matrix.language }}

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate TypeScript security definitions
        run: |
          npx tsc --noEmit src/backend/src/middleware/securityHeaders.ts src/backend/src/middleware/inputValidation.ts src/backend/src/middleware/rateLimiting.ts src/backend/src/services/encryption.ts
        working-directory: ./src/backend
        continue-on-error: true

      - name: Check for hardcoded secrets
        uses: TruffleHog/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json
        continue-on-error: true

  sca-analysis:
    name: Software Composition Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Generate SBOM (frontend)
        run: |
          npm ci --no-save
          npx cyclonedx-npm --output-format json --output-file sbom-frontend.json
        working-directory: ./src/frontend
        continue-on-error: true

      - name: Generate SBOM (backend)
        run: |
          npm ci --no-save
          npx cyclonedx-npm --output-format json --output-file sbom-backend.json
        working-directory: ./src/backend
        continue-on-error: true

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-reports
          path: |
            src/frontend/sbom-frontend.json
            src/backend/sbom-backend.json
          retention-days: 90

  dast-scan:
    name: Dynamic Application Security Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./src/backend

      - name: Start backend server
        run: |
          npm run build
          npm start &
          sleep 10
        working-directory: ./src/backend
        env:
          NODE_ENV: development
          PORT: 3000

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: report_md.md
          retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/backend

      - name: Check licenses (backend)
        run: |
          npx license-check-and-gather --production --out report
        working-directory: ./src/backend
        continue-on-error: true

      - name: Generate license report
        run: |
          npx license-report --package ./package.json > license-report.txt
        working-directory: ./src/backend
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: src/backend/license-report.txt
          retention-days: 90

  report-summary:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql-scan]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scans Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency Audit (npm)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security Headers Validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Software Composition Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports available in Artifacts section" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🔒 Security Scanning Complete\n\nAll security scans have been executed:\n- ✅ Dependency Audit\n- ✅ CodeQL Analysis\n- ✅ Security Headers Validation\n- ✅ SBOM Generation\n- ✅ License Compliance\n\nReports available in the workflow artifacts.'
            })
