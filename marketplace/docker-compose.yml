# Local PostgreSQL for development and tests: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ll
      POSTGRES_PASSWORD: ll
      POSTGRES_DB: locallegends
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
