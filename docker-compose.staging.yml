version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wedding-staging-db
    environment:
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_password_change_me
      POSTGRES_DB: wedding_staging
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d wedding_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wedding-staging-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend API Server
  backend:
    image: ghcr.io/sageytechsolutions-create/wedding2027/backend:latest
    container_name: wedding-staging-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      LOG_LEVEL: info
      PORT: 3000
      DATABASE_URL: postgresql://staging_user:staging_password_change_me@postgres:5432/wedding_staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Add other environment variables as needed:
      # SENTRY_DSN: https://...@sentry.io/...
      # JWT_SECRET: your_secret_here
      # SUPABASE_URL: https://...
      # SUPABASE_ANON_KEY: ...
    ports:
      - "3000:3000"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    volumes:
      - backend_logs:/app/logs

  # Frontend Web Server
  frontend:
    image: ghcr.io/sageytechsolutions-create/wedding2027/frontend:latest
    container_name: wedding-staging-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    environment:
      # Frontend environment variables (if needed)
      VITE_API_URL: http://localhost:3000/api

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: wedding-staging-proxy
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - staging-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  staging-network:
    driver: bridge
